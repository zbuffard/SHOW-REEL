<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
}

video {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    display: block;
    cursor: pointer;
}
</style>
</head>

<body>

<video id="showreel" autoplay muted loop playsinline preload="auto">
    <source src="Video.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById('showreel');

video.addEventListener('click', () => {
    video.muted = !video.muted;
    video.volume = video.muted ? 0 : 1;
    video.play();
});
</script>

</body>
</html>
